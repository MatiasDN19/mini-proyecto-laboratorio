name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Lint y pruebas (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        php: ['8.2', '8.3']

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Instalar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer
          coverage: none

      - name: Validar composer.json
        run: composer validate --strict

      - name: Cachear dependencias de Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-php${{ matrix.php }}-${{ hashFiles('composer.lock') }}

      - name: Instalar dependencias
        run: composer install --no-progress --prefer-dist --no-interaction

      - name: Lint de sintaxis (php -l)
        run: find src public views tests -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Lint de estandar (PHPCS, PSR-12)
        run: vendor/bin/phpcs

      - name: Pruebas unitarias (PHPUnit)
        run: vendor/bin/phpunit --testdox
